# Used by the `alembic` command line, run from this folder:
#   alembic upgrade head            apply every migration
#   alembic revision -m "..."       start a new one
# The app also applies migrations itself on every start (app/database.py), so a normal
# deploy needs no manual step. The database URL comes from the app's settings, not from here.

[alembic]
script_location = alembic
prepend_sys_path = .
